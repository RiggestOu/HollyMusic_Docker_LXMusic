name: Build and Publish Docker Image

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # GHCR 要求镜像仓库名必须全小写
      - name: Compute lowercase image name
        id: prep
        run: echo "image_name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---------- 先打包源码（避免后续构建镜像时目录变化导致 tar 报错） ----------
      - name: Package source code
        run: |
          # 先 tar 再 zip，避免 tar 看到 zip 文件导致 "file changed as we read it" 错误
          tar czf hollymusic-source-latest.tar.gz --ignore-failed-read \
            --exclude='.git' --exclude='target' --exclude='node_modules' \
            --exclude='*.dockerignore' --exclude='*.md' --exclude='*.gz' .
          zip -r hollymusic-source-latest.zip . -x "*.git/*" "*.target/*" "node_modules/*" "*.dockerignore" "*.md" "*.gz"
          ls -lh hollymusic-source-latest.*

      # ---------- 本地构建镜像 + 打离线 tar.gz + 推送 GHCR ----------
      - name: Build image (local) and package tar.gz
        env:
          DOCKER_BUILDKIT: 1
        run: |
          IMG="${REGISTRY}/${{ steps.prep.outputs.image_name }}"
          docker build -t "$IMG:latest" .
          docker save "$IMG:latest" | gzip > hollymusic_docker_lxmusic-latest.tar.gz
          ls -lh hollymusic_docker_lxmusic-latest.tar.gz

      - name: Push Docker image to GHCR
        if: github.event_name != 'pull_request'
        run: |
          IMG="${REGISTRY}/${{ steps.prep.outputs.image_name }}"
          docker tag "$IMG:latest" "$IMG:${{ github.sha }}"
          docker tag "$IMG:latest" "$IMG:build-${{ github.run_number }}"
          docker push "$IMG:latest"
          docker push "$IMG:${{ github.sha }}"
          docker push "$IMG:build-${{ github.run_number }}"

      # ---------- 发布到 GitHub Release (curl API + 重试，避免 softprops 静默失败) ----------
      - name: Publish to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="hollymusic-docker-latest"
          FILES="hollymusic_docker_lxmusic-latest.tar.gz hollymusic-source-latest.zip hollymusic-source-latest.tar.gz"

          # 获取或创建 release
          RELEASE_ID=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
            | jq -r '.id // empty')

          if [ -z "$RELEASE_ID" ]; then
            RELEASE_ID=$(curl -s -X POST \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"$TAG\",\"name\":\"$TAG\",\"make_latest\":\"true\",\"body\":\"Docker image + source packages. Import: gzip -d hollymusic_docker_lxmusic-latest.tar.gz | docker load\"}" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases" \
              | jq -r '.id')
            echo "Created new release id=$RELEASE_ID"
          fi

          # 删除旧 assets
          for OLD_NAME in hollymusic_docker_lxmusic-latest.tar.gz hollymusic-source-latest.zip hollymusic-source-latest.tar.gz; do
            OLD_ID=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" \
              | jq -r ".[] | select(.name==\"$OLD_NAME\") | .id" | head -1)
            if [ -n "$OLD_ID" ]; then
              echo "Deleting old asset: $OLD_NAME (id=$OLD_ID)"
              curl -s -X DELETE -H "Authorization: token $GITHUB_TOKEN" \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$OLD_ID"
            fi
          done

          # 上传每个 asset（带重试）
          for FILE in $FILES; do
            UPLOAD_URL="https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$FILE"
            SUCCESS=false
            for i in 1 2 3; do
              echo "Uploading $FILE (attempt $i)..."
              HTTP_CODE=$(curl -s -L \
                -H "Authorization: token $GITHUB_TOKEN" \
                -H "Content-Type: application/octet-stream" \
                -X POST \
                "$UPLOAD_URL" \
                --data-binary "@$FILE" \
                -o /dev/null -w "%{http_code}")
              if echo "$HTTP_CODE" | grep -q "^2"; then
                echo "Upload succeeded: $FILE"
                SUCCESS=true
                break
              fi
              echo "Upload failed (HTTP $HTTP_CODE), retrying in 10s..."
              sleep 10
            done
            if [ "$SUCCESS" != "true" ]; then
              echo "::error::Failed to upload $FILE after 3 attempts"
              exit 1
            fi
          done
