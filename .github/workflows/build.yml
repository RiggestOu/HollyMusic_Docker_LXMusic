name: Build and Release Docker Image

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t hollymusic_docker_lxmusic:latest .

      - name: Save Docker image as tar.gz
        run: |
          docker save hollymusic_docker_lxmusic:latest | gzip > hollymusic_docker_lxmusic-latest.tar.gz
          ls -lh hollymusic_docker_lxmusic-latest.tar.gz

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: HollyMusic Docker Image latest
          files: hollymusic_docker_lxmusic-latest.tar.gz
          overwrite_files: true
          generate_release_notes: true
