name: Build and Publish Docker Image

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # GHCR 要求镜像仓库名必须全小写
      - name: Compute lowercase image name
        id: prep
        run: echo "image_name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---------- 本地构建镜像 + 打离线 tar.gz + 推送 GHCR ----------
      # 用 docker build（BuildKit）在本地直接生成镜像，docker save 导出 tar.gz（不再 docker pull 回拉，
      # 避免「push 后本地无镜像 → pull 失败 → tar.gz 缺失 → Release 没发」的链路断裂）。
      - name: Build image (local) and package tar.gz
        env:
          DOCKER_BUILDKIT: 1
        run: |
          IMG="${REGISTRY}/${{ steps.prep.outputs.image_name }}"
          docker build -t "$IMG:latest" .
          docker save "$IMG:latest" | gzip > hollymusic_docker_lxmusic-latest.tar.gz
          ls -lh hollymusic_docker_lxmusic-latest.tar.gz

      - name: Push Docker image to GHCR
        if: github.event_name != 'pull_request'
        run: |
          IMG="${REGISTRY}/${{ steps.prep.outputs.image_name }}"
          docker tag "$IMG:latest" "$IMG:${{ github.sha }}"
          docker tag "$IMG:latest" "$IMG:build-${{ github.run_number }}"
          docker push "$IMG:latest"
          docker push "$IMG:${{ github.sha }}"
          docker push "$IMG:build-${{ github.run_number }}"

      # ---------- 离线安装包：docker save -> tar.gz -> GitHub Release ----------
      # 用固定滚动 tag（hollymusic-docker-latest）复用同一 Release。
      # 改用 GitHub API 直接上传 asset（带重试），避免 softprops/action-gh-release
      # 上传大文件时 "other side closed" 且静默不报错的问题。
      - name: Publish image tar.gz to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="hollymusic-docker-latest"
          FILE="hollymusic_docker_lxmusic-latest.tar.gz"

          # 获取 release ID（已存在则复用，否则创建）
          RELEASE_ID=$(curl -s --max-time 60 \
            -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
            | jq -r '.id // empty')

          if [ -z "$RELEASE_ID" ]; then
            RELEASE_ID=$(curl -s --max-time 60 -X POST \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"$TAG\",\"name\":\"$TAG\",\"make_latest\":\"true\",\"body\":\"Docker 镜像离线包（docker save 导出，含 latest tag）。\\n导入：gzip -d ${FILE} | docker load\"}" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases" \
              | jq -r '.id')
            echo "Created new release id=$RELEASE_ID"
          fi

          # 删除旧的同名 asset（如果有）
          curl -s --max-time 60 \
            -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" \
            | jq -r '.[] | select(.name == "'"$FILE"'") | .id' \
            | while read -r ASSET_ID; do
                echo "Deleting old asset id=$ASSET_ID"
                curl -s --max-time 60 -X DELETE \
                  -H "Authorization: token $GITHUB_TOKEN" \
                  "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID"
              done

          # 上传新 asset（最多重试 5 次，每次间隔 30 秒）
          UPLOAD_URL="https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$FILE"
          SUCCESS=false
          for i in 1 2 3 4 5; do
            echo "Uploading $FILE (attempt $i)..."
            # 使用 --connect-timeout 和 --max-time 设置超时
            HTTP_CODE=$(curl -s -L --connect-timeout 30 --max-time 600 \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              -X POST \
              "$UPLOAD_URL" \
              --data-binary "@$FILE" \
              -o /dev/null -w "%{http_code}")
            
            if [[ "$HTTP_CODE" =~ ^2 ]]; then
              echo "Upload succeeded with HTTP $HTTP_CODE."
              SUCCESS=true
              break
            fi
            echo "Upload failed with HTTP $HTTP_CODE, retrying in 30s..."
            sleep 30
          done

          if [ "$SUCCESS" != "true" ]; then
            echo "::error::Failed to upload $FILE after 5 attempts"
            exit 1
          fi