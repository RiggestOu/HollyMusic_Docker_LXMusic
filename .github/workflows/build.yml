name: Build and Publish Docker Image

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # GHCR 要求镜像仓库名必须全小写
      - name: Compute lowercase image name
        id: prep
        run: echo "image_name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          # 推送三个 tag：
          #   latest        —— 永远指向最新构建
          #   <commit-sha>  —— 精确锁定某次提交，便于回滚排查
          #   build-<N>     —— 递增且好认，每次推送都会多一条
          tags: |
            ${{ env.REGISTRY }}/${{ steps.prep.outputs.image_name }}:latest
            ${{ env.REGISTRY }}/${{ steps.prep.outputs.image_name }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ steps.prep.outputs.image_name }}:build-${{ github.run_number }}
          platforms: linux/amd64
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      # ---------- 离线安装包：docker save -> tar.gz（随后发布到 GitHub Release） ----------
      - name: Package image (save + gzip)
        run: |
          IMAGE="${REGISTRY}/${{ steps.prep.outputs.image_name }}:latest"
          docker pull "$IMAGE"
          docker save "$IMAGE" | gzip > hollymusic_docker_lxmusic-latest.tar.gz
          ls -lh hollymusic_docker_lxmusic-latest.tar.gz

      # ---------- 离线安装包：docker save -> tar.gz -> GitHub Release ----------
      # 用固定滚动 tag（hollymusic-docker-latest）复用同一 Release：不递增版本号、不每 build 一个 tag。
      # 注意：GitHub Release 必须关联一个 git tag，此处为该「固定滚动 tag」，每次构建更新同一 Release。
      # 此举会创建一个固定 git tag（hollymusic-docker-latest），与「禁止生成 git tag」规则冲突——
      # 为满足“发布到 Release”的诉求采用此折中，如需零 tag 请告知我改回纯 Artifact。
      - name: Publish image tar.gz to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: hollymusic-docker-latest
          name: hollymusic-docker-latest
          make_latest: true
          files: hollymusic_docker_lxmusic-latest.tar.gz
          body: |
            Docker 镜像离线包（docker save 导出，含 latest tag）。
            导入：gzip -d hollymusic_docker_lxmusic-latest.tar.gz | docker load
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}