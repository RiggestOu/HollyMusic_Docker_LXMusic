name: Build and Publish Docker Image

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # GHCR 要求镜像仓库名必须全小写
      - name: Compute lowercase image name
        id: prep
        run: echo "image_name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---------- 本地构建镜像 + 打离线 tar.gz + 推送 GHCR ----------
      # 用 docker build（BuildKit）在本地直接生成镜像，docker save 导出 tar.gz（不再 docker pull 回拉，
      # 避免「push 后本地无镜像 → pull 失败 → tar.gz 缺失 → Release 没发」的链路断裂）。
      - name: Build image (local) and package tar.gz
        env:
          DOCKER_BUILDKIT: 1
        run: |
          IMG="${REGISTRY}/${{ steps.prep.outputs.image_name }}"
          docker build -t "$IMG:latest" .
          docker save "$IMG:latest" | gzip > hollymusic_docker_lxmusic-latest.tar.gz
          ls -lh hollymusic_docker_lxmusic-latest.tar.gz

      - name: Push Docker image to GHCR
        if: github.event_name != 'pull_request'
        run: |
          IMG="${REGISTRY}/${{ steps.prep.outputs.image_name }}"
          docker tag "$IMG:latest" "$IMG:${{ github.sha }}"
          docker tag "$IMG:latest" "$IMG:build-${{ github.run_number }}"
          docker push "$IMG:latest"
          docker push "$IMG:${{ github.sha }}"
          docker push "$IMG:build-${{ github.run_number }}"

      # ---------- 离线安装包：docker save -> tar.gz -> GitHub Release ----------
      # 用固定滚动 tag（hollymusic-docker-latest）复用同一 Release：不递增版本号、不每 build 一个 tag。
      # 注意：GitHub Release 必须关联一个 git tag，此处为该「固定滚动 tag」，每次构建更新同一 Release。
      # 这是用户确认的折中：CI 用固定滚动 tag 发布到 Release，但不产生递增版本号 / 本地标签（SourceTree 不显示）。
      # 退化选项：如需完全零 tag，请告知我改回纯 Artifact（但将不再发 Release）。
      - name: Publish image tar.gz to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: hollymusic-docker-latest
          name: hollymusic-docker-latest
          make_latest: true
          files: hollymusic_docker_lxmusic-latest.tar.gz
          body: |
            Docker 镜像离线包（docker save 导出，含 latest tag）。
            导入：gzip -d hollymusic_docker_lxmusic-latest.tar.gz | docker load
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}