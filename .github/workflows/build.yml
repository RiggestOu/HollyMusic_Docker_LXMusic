name: Build and Publish Docker Image

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # GHCR 要求镜像仓库名必须全小写
      - name: Compute lowercase image name
        id: prep
        run: echo "image_name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          # 推送三个 tag：
          #   latest        —— 永远指向最新构建
          #   <commit-sha>  —— 精确锁定某次提交，便于回滚排查
          #   build-<N>     —— 递增且好认，每次推送都会多一条
          tags: |
            ${{ env.REGISTRY }}/${{ steps.prep.outputs.image_name }}:latest
            ${{ env.REGISTRY }}/${{ steps.prep.outputs.image_name }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ steps.prep.outputs.image_name }}:build-${{ github.run_number }}
          platforms: linux/amd64
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      # ---------- 离线安装包：docker save -> tar.gz -> GitHub Artifacts ----------
      # 不使用 Release/tag，只作为 workflow artifact 提供下载
      - name: Package image (save + gzip)
        run: |
          IMAGE="${REGISTRY}/${{ steps.prep.outputs.image_name }}:latest"
          docker pull "$IMAGE"
          docker save "$IMAGE" | gzip > hollymusic_docker_lxmusic-latest.tar.gz
          ls -lh hollymusic_docker_lxmusic-latest.tar.gz

      - name: Upload image tar.gz
        uses: actions/upload-artifact@v4
        with:
          name: hollymusic-docker-image
          path: hollymusic_docker_lxmusic-latest.tar.gz