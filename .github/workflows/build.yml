name: Build and Publish Docker Image

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # GHCR 要求镜像仓库名必须全小写
      - name: Compute lowercase image name
        id: prep
        run: echo "image_name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---------- 先打包源码（避免后续构建镜像时目录变化导致 tar 报错） ----------
      - name: Package source code
        run: |
          zip -r hollymusic-source-latest.zip . -x "*.git/*" "*.target/*" "node_modules/*" "*.dockerignore" "*.md" "*.gz"
          tar czf hollymusic-source-latest.tar.gz --exclude='.git' --exclude='target' --exclude='node_modules' --exclude='*.dockerignore' --exclude='*.md' --exclude='*.gz' .
          ls -lh hollymusic-source-latest.*

      # ---------- 本地构建镜像 + 打离线 tar.gz + 推送 GHCR ----------
      - name: Build image (local) and package tar.gz
        env:
          DOCKER_BUILDKIT: 1
        run: |
          IMG="${REGISTRY}/${{ steps.prep.outputs.image_name }}"
          docker build -t "$IMG:latest" .
          docker save "$IMG:latest" | gzip > hollymusic_docker_lxmusic-latest.tar.gz
          ls -lh hollymusic_docker_lxmusic-latest.tar.gz

      - name: Push Docker image to GHCR
        if: github.event_name != 'pull_request'
        run: |
          IMG="${REGISTRY}/${{ steps.prep.outputs.image_name }}"
          docker tag "$IMG:latest" "$IMG:${{ github.sha }}"
          docker tag "$IMG:latest" "$IMG:build-${{ github.run_number }}"
          docker push "$IMG:latest"
          docker push "$IMG:${{ github.sha }}"
          docker push "$IMG:build-${{ github.run_number }}"

      # ---------- 发布到 GitHub Release ----------
      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: hollymusic-docker-latest
          name: hollymusic-docker-latest
          make_latest: true
          files: |
            hollymusic_docker_lxmusic-latest.tar.gz
            hollymusic-source-latest.zip
            hollymusic-source-latest.tar.gz
          body: |
            ## Docker 镜像离线包
            导入：gzip -d hollymusic_docker_lxmusic-latest.tar.gz | docker load

            ## 源码包（ZIP 格式）
            包含完整源码（不含 node_modules、target、.git 目录）。

            ## 源码包（TAR.GZ 格式）
            同上，tar.gz 压缩格式。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
