name: Build Desktop Client (Windows)

# 与 build.yml（Docker 镜像）并列：同一次 push 会同时触发两条流水线。
#   · build.yml    → GHCR 容器镜像（服务端 / NAS 部署）
#   · desktop.yml  → Windows 客户端安装包（桌面壁纸 + 桌面歌词外壳）
on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Rust 工具链：Tauri 2.x 要求较新的 stable，这里直接用 stable 即可。
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Tauri CLI 以 npm 包形式提供（@tauri-apps/cli），需要先安装依赖。
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app (NSIS installer)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: pnpm tauri
          args: --target x86_64-pc-windows-msvc

      # 提供 artifact 下载（不使用 Release/tag）
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: hollymusic-desktop-windows
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          if-no-files-found: warn

      # ---------- 打包为 artifact（不创建 Release/tag） ----------
      - name: Package installer zip
        shell: pwsh
        run: |
          $exe = Get-ChildItem "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe" | Select-Object -First 1
          Compress-Archive -Path $exe.FullName -DestinationPath "hollymusic-desktop-latest.zip" -Force
          Get-Item "hollymusic-desktop-latest.zip" | Select-Object Name, Length

      - name: Upload installer zip
        uses: actions/upload-artifact@v4
        with:
          name: hollymusic-desktop-installer
          path: hollymusic-desktop-latest.zip
