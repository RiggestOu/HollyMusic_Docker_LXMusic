name: Build Desktop Client (Windows)

# 与 build.yml（Docker 镜像）并列：同一次 push 会同时触发两条流水线。
#   · build.yml    → GHCR 容器镜像（服务端 / NAS 部署）
#   · desktop.yml  → Windows 客户端安装包（桌面壁纸 + 桌面歌词外壳）
on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Rust 工具链：Tauri 2.x 要求较新的 stable，这里直接用 stable 即可。
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Tauri CLI 以 npm 包形式提供（@tauri-apps/cli），需要先安装依赖。
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app (NSIS installer)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: pnpm tauri
          args: --target x86_64-pc-windows-msvc

      # 原始 exe/msi 仍作为 artifact 备份（主要发布入口是下方 Release）
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: hollymusic-desktop-windows
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          if-no-files-found: warn

      # ---------- 打包为 zip（随后发布到 GitHub Release） ----------
      - name: Package installer zip
        shell: pwsh
        run: |
          $exe = Get-ChildItem "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe" | Select-Object -First 1
          Compress-Archive -Path $exe.FullName -DestinationPath "hollymusic-desktop-latest.zip" -Force
          Get-Item "hollymusic-desktop-latest.zip" | Select-Object Name, Length

      # 固定滚动 tag（hollymusic-desktop-latest）复用同一 Release。
      # 改用 GitHub API 直接上传 asset（带重试），避免 softprops/action-gh-release
      # 上传大文件时 "other side closed" 且静默不报错的问题。
      - name: Publish installer to Release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $TAG = "hollymusic-desktop-latest"
          $FILE = "hollymusic-desktop-latest.zip"
          $URI = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$TAG"

          # 获取或创建 release
          $resp = Invoke-RestMethod -Uri $URI -Method Get -Headers @{ Authorization = "token $GITHUB_TOKEN" } -ErrorAction SilentlyContinue
          if ($resp) {
            $RELEASE_ID = $resp.id
            Write-Host "Found existing release id=$RELEASE_ID"
          } else {
            $body = @{ tag_name = $TAG; name = $TAG; make_latest = $true; body = "Windows desktop client installer (NSIS)." } | ConvertTo-Json
            $resp = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases" -Method Post -Headers @{ Authorization = "token $GITHUB_TOKEN"; "Content-Type" = "application/json" } -Body $body
            $RELEASE_ID = $resp.id
            Write-Host "Created new release id=$RELEASE_ID"
          }

          # 删除旧 asset
          $assets = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" -Headers @{ Authorization = "token $GITHUB_TOKEN" }
          foreach ($a in $assets) {
            if ($a.name -eq $FILE) {
              Write-Host "Deleting old asset: $($a.name) (id=$($a.id))"
              Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/assets/$($a.id)" -Method Delete -Headers @{ Authorization = "token $GITHUB_TOKEN" } | Out-Null
            }
          }

          # 上传 asset（带重试）
          $UPLOAD_URL = "https://uploads.github.com/repos/$env:GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$FILE"
          3.times { |i|
            Write-Host "Uploading $FILE (attempt $i+1)..."
            try {
              Invoke-RestMethod -Uri $UPLOAD_URL -Method Post -Headers @{ Authorization = "token $GITHUB_TOKEN"; "Content-Type" = "application/octet-stream" } -InFile $FILE | Out-Null
              Write-Host "Upload succeeded: $FILE"
              return
            } catch {
              Write-Host "Upload failed: $_, retrying in 10s..."
              Start-Sleep 10
            }
          }
          Write-Error "Failed to upload $FILE after 3 attempts"
          exit 1
