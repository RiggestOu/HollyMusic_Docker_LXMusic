name: Build Desktop Client (Windows)

# 与 build.yml（Docker 镜像）并列：同一次 push 会同时触发两条流水线。
#   · build.yml    → GHCR 容器镜像（服务端 / NAS 部署）
#   · desktop.yml  → Windows 客户端安装包（桌面壁纸 + 桌面歌词外壳）
on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Rust 工具链：Tauri 2.x 要求较新的 stable，这里直接用 stable 即可。
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Tauri CLI 以 npm 包形式提供（@tauri-apps/cli），需要先安装依赖。
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app (NSIS installer)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: pnpm tauri
          args: --target x86_64-pc-windows-msvc

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: hollymusic-desktop-windows
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          if-no-files-found: warn

      # 打 tag（v*）时顺带发布到 Release，方便直接下载安装包。
      - name: Publish to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi

      # ---------- 每次构建都更新固定预发布 desktop-latest（无需打 tag，入口恒定） ----------
      # 与 build.yml 的 image-latest 同一套思路：删旧建新，下载地址永远不变。
      # 镜像 zip 与客户端 zip 分开两个 Release：
      #   image-latest   -> hollymusic-image-latest.zip   （内含 image.tar，NAS 用）
      #   desktop-latest -> hollymusic-desktop-latest.zip （内含安装 exe，PC 用）
      - name: Package installer zip
        shell: pwsh
        run: |
          $exe = Get-ChildItem "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe" | Select-Object -First 1
          Compress-Archive -Path $exe.FullName -DestinationPath "hollymusic-desktop-latest.zip" -Force
          Get-Item "hollymusic-desktop-latest.zip" | Select-Object Name, Length

      - name: Upload installer zip to GitHub Release (desktop-latest)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete desktop-latest --cleanup-tag --yes || true
          gh release create desktop-latest hollymusic-desktop-latest.zip \
            --title "Windows client installer (latest build)" \
            --notes "每次 push 自动更新的最新 Windows 安装包（版本 v0.0.1）。下载解压后运行里面的 setup exe 安装；会弹出 UAC 管理员确认，点【是】即可装进系统安装目录。如旧版正在运行，安装程序会先自动结束旧进程。" \
            --prerelease
