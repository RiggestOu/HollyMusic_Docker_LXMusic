version: '3.8'

services:
  holly-mudic:
    build:
      context: .
      dockerfile: Dockerfile
    image: holly-mudic:latest
    container_name: holly-mudic
    ports:
      - "3080:3080"
    volumes:
      - ./data/config:/data/config
    environment:
      - NODE_ENV=production
      - CHROME_FLAGS=--no-sandbox --disable-gpu --disable-dev-shm-usage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - holly-mudic-net

  # 可选：开发模式服务
  holly-mudic-dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: holly-mudic:latest
    container_name: holly-mudic-dev
    ports:
      - "3080:3080"
    volumes:
      - ./data/config:/data/config
      - ./src:/app/src
      - ./dist:/app/dist
    environment:
      - NODE_ENV=development
      - CHROME_FLAGS=--no-sandbox --disable-gpu --disable-dev-shm-usage
    command: ["npm", "run", "dev"]
    networks:
      - holly-mudic-net

networks:
  holly-mudic-net:
    driver: bridge
