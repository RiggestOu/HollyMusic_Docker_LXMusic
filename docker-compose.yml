# ============================================================
# HollyMusic 部署配置
# ============================================================
# 本仓库 = HollyMusic 官方源码（redcatH/HollyMusic）+ 定制功能：
#   · 歌单歌曲右键菜单「移出歌单」
#   · 歌单页「导入 / 导出」按钮
#   · LX Music 音源加载/搜索/播放/下载后端逻辑整合
#
# 镜像：本仓库 CI 自动构建并推送到 GHCR
#   https://github.com/users/RiggestOu/packages/container/package/hollymusic_docker_lxmusic
#
# ⚠️ 必填：.env 中需有 AUTH_SECRET（≥32 位随机字符串，生成：openssl rand -hex 32）
#    首次启动自动建库并运行 Prisma 迁移，数据持久化在 ./prisma_data
#
# 使用：docker compose up -d
# 访问：http://localhost:3099
#
# 提示：容器内服务监听 3000，因此端口映射右侧须为 3000。
#      若 .env 文件不存在，compose 会启动失败 —— 请先 `touch .env`
#      或把下面 env_file 两行注释掉。
# ============================================================

services:
  app:
    image: ghcr.io/riggestou/hollymusic_docker_lxmusic:latest
    container_name: holly-music

    # ★ 镜像更新策略（选一个，默认 missing 是"本地有就不拉"，最容易踩坑）
    #
    #   always      —— 每次 up/重建都向注册表核对 digest。
    #                  代价极小：只是几次 HTTP 请求（几 KB、1~2 秒），
    #                  digest 不变时【不会】重新下载任何层，秒过。
    #   daily       —— 距上次拉取超过 24h 才核对一次（语义更省，但需较新 Compose）
    #   every_12h   —— 每 12h 核对一次（同上，需较新 Compose）
    #   missing     —— 默认值：本地已有同名 tag 就不拉（不推荐，会一直跑旧镜像）
    #   never       —— 从不拉取（离线环境用）
    #
    # 若你的 Compose 版本较旧、构建时报错提示不认识该字段，
    # 删掉本行即可，改用「群晖计划任务定时执行 docker compose pull && up -d」
    # 或直接把 tag 改成精确版本号（如 build-11）。
    pull_policy: always

    ports:
      - "3099:3000"

    env_file:
      - .env

    environment:
      - NODE_ENV=production
      # SQLite 数据库（歌单/收藏等数据持久化在 ./prisma_data，重要！）
      - DATABASE_URL=file:./prisma/data/music.db
      # 音频磁盘缓存：指向已挂载的 ./cache_data
      - ENABLE_FILE_CACHE=true
      - AUDIO_CACHE_DIR=/app/.cache/audio-cache
      - AUDIO_CACHE_QUOTA_GB=10

    volumes:
      - ./custom-sources:/app/custom-sources
      - ./config:/app/config
      - ./prisma_data:/app/prisma/prisma/data
      - ./cache_data:/app/.cache
      - ./app_logs:/app/logs

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
