version: '3.8'

services:
  holly-mudic:
    build:
      context: .
      dockerfile: Dockerfile
    image: holly-mudic:latest
    container_name: holly-mudic
    ports:
      - "3080:3080"
    volumes:
      - ./data/config:/data/config
    environment:
      - NODE_ENV=production
      - PORT=3080
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - holly-mudic-net

networks:
  holly-mudic-net:
    driver: bridge
