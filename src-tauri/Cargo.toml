[package]
name = "hollymusic-desktop"
version = "0.1.0"
description = "HollyMusic 桌面客户端（Windows 桌面壁纸 + 桌面歌词外壳）"
authors = ["HollyMusic"]
edition = "2021"
rust-version = "1.77.2"

# Tauri 2 要求 crate 同时产出 rlib（供主程序调用）与 cdylib/staticlib（供打包器使用）。
[lib]
name = "hollymusic_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
dirs = "5"

# 仅 Windows 需要：本项目的桌面壁纸 / 桌面歌词依赖 Win32 原生窗口操作。
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
