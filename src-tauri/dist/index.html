<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HollyMusic Desktop</title>
    <style>
      :root { color-scheme: dark; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex; align-items: center; justify-content: center;
        background: #08080c; color: #e8e8ef;
        font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      }
      .box { max-width: 32rem; padding: 2rem; text-align: center; }
      h1 { font-size: 1.25rem; font-weight: 600; letter-spacing: .02em; }
      p { color: #9aa0ae; font-size: .875rem; line-height: 1.7; }
      code { color: #f7e7ce; background: #17171f; padding: .1rem .35rem; border-radius: .25rem; }
      a { color: #a8e6cf; }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>HollyMusic Desktop</h1>
      <p>
        正在连接你的 HollyMusic 服务……<br />
        若长时间停留在此页，请确认服务地址已正确配置（默认 <code>http://localhost:3099</code>）。
      </p>
      <p><a id="link" href="http://localhost:3099">手动打开服务地址</a></p>
    </div>
    <script>
      // 该页面只是 frontendDist 的占位页：正常运行窗口由 Rust 侧按配置直接导航到服务地址，
      // 仅在服务不可达 / 配置缺失时才会看到这里。
      var target = 'http://localhost:3099'
      var link = document.getElementById('link')
      link.href = target
      link.textContent = '手动打开 ' + target
    </script>
  </body>
</html>
